[package]
name = "timesheet-tauri"
version = "0.1.0"
description = "A Tauri-based timesheet tracking application"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-notification = "2.0.0"
tauri-plugin-shell = "2.0.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
image = "0.25"
worklog-config = { path = "../../worklog-config" }
worklog-core = { path = "../../worklog-core" }
worklog-jira-adapter = { path = "../../worklog-jira-adapter" }
worklog-sqlite-storage = { path = "../../worklog-sqlite-storage" }
reqwest = { version = "0.12", features = ["json"] }
tiny_http = "0.12"
url = "2.5"
open = "5.0"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
core-foundation = "0.9"
core-graphics = "0.23"
block = "0.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

