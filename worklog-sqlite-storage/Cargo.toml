[package]
name = "worklog-sqlite-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
worklog-core = { path = "../worklog-core" }
rusqlite = { version = "0.36", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
log = "0.4"
async-trait = "0.1"
tokio = { workspace = true, features = ["sync", "rt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
env_logger = "0.11"

